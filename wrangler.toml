name = "solpbc-org"
account_id = "3f2c1528c7d4d9685819ea9e9e307c92"
compatibility_date = "2025-04-01"
main = "worker.js"

routes = [
  { pattern = "solpbc.org", custom_domain = true },
  { pattern = "www.solpbc.org", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Force Worker invocation for these paths so applySecurityHeaders() sets their
# specific (looser-than-base) CSP instead of the tight default _headers /* CSP:
#   /contact*  → CONTACT_CSP  (Cloudflare Turnstile on the contact form)
#   /demo/*    → DEMO_CSP     (stage-tool walkthroughs)
#   /talks/*   → TALKS_CSP    (recorded talks with Cloudflare Stream embeds)
#   /brands*   → BRANDS_CSP   (brand media portal same-origin clipboard JS — build spec §5.6)
# The _headers /* CSP is the tight BASE and stays identical to SECURITY_HEADERS in
# worker.js; per-page relaxations live ONLY here + the worker, never widen _headers.
run_worker_first = ["/contact", "/contact/*", "/demo/*", "/talks/*", "/brands", "/brands.html", "/brands/*"]

[[unsafe.bindings]]
name = "CONTACT_LIMITER"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 5, period = 60 }

[[kv_namespaces]]
binding = "CONTACT_SUBMISSIONS"
id = "f1a2b62b145346179858ef66612b58cb"

# Secrets (set with: wrangler secret put <NAME> --name solpbc-org)
# TURNSTILE_SECRET — Turnstile secret key from Cloudflare dashboard
# HUB_WEBHOOK_URL — outbound hub webhook endpoint
# HUB_WEBHOOK_SECRET — secret sent on OUTBOUND contact-form webhook delivery to the hub
# CONTACT_SWEEP_SECRET — DISTINCT secret the hub presents to authenticate its INBOUND
#   GET/DELETE /api/contact/pending sweep calls (non-coupling: split from HUB_WEBHOOK_SECRET)
